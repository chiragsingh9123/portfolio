name: Deploy via tmux

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 76.13.243.16
          username: root
          key: ${{ secrets.SSH_KEY }}
          debug: true
          script: |
            echo "Connected to server"

            tmux send-keys -t potfolio-3 C-c || true
            echo "Stopping old app"

            sleep 2
            echo "Pulling latest code"
            git pull origin main



            echo "Starting app"
            tmux send-keys -t portfolio "python smpppp.py" Enter

            echo "Deploy complete"