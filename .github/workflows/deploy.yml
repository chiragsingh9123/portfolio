name: Deploy via tmux

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: debian-latest

    steps:
      - name: Deploy to VPS using tmux
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 76.13.243.16
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/portfolio

            echo "📥 Pull latest code"
            git pull origin main

            echo "🛑 Stop old process"
            tmux send-keys -t portfolio C-c

            sleep 2

            echo "🚀 Start new process"
            tmux send-keys -t portfolio "python smpppp.py" Enter

            echo "✅ Deploy complete"