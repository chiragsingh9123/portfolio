name: Deploy via tmux

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 76.13.243.16
          username: root
          key: ${{ secrets.SSH_KEY }}
          debug: true
          script: |
            echo "Connected to server"

            cd /root/portfolio

            echo "Pulling latest code"
            git pull origin main

            echo "Stopping old app"
            tmux send-keys -t porfolio-3 C-c || true

            sleep 2

            echo "Starting app"
            tmux send-keys -t portfolio "cd /root/portfolio" Enter
            tmux send-keys -t portfolio "source env/bin/activate" Enter
            tmux send-keys -t portfolio "python smpppp.py" Enter

            echo "Deploy complete"