name: Deploy via tmux

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 76.13.243.16
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "📥 Pull latest code"
            cd /root/portfolio
            git pull origin main

            echo "🛑 Stop running app"
            tmux attach  -t portfolio-3 C-c || true

            sleep 2

            echo "🚀 Start new app"

            tmux attach -t portfolio-3 "python smpppp.py" Enter

            echo "✅ Deploy done"